[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-availability"
version = "0.9.2"
description = "Vocabulary ceilings for pooled classification metrics"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2"]
authors = [{name = "Shah Zaib Sajid", email = "shahzaibjanjua25@gmail.com"}]

[project.scripts]
label-availability = "label_availability.__main__:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["label_availability*"]
