name: Verify count bounds and archived scores

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: python -m pip install -r code/requirements.txt
      - run: python -m pip install --no-deps .
      - run: python code/check_availability.py
      - run: python code/verify_cic_archive.py results
